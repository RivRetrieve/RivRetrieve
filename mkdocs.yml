site_name: RivRetrieve
site_description: "A Python package for downloading global river gauge data"
site_url: "https://rivretrieve.github.io/"
repo_url: "https://github.com/RivRetrieve/RivRetrieve"
repo_name: "RivRetrieve/RivRetrieve"
docs_dir: "docs"
watch:
  - README.md
  - src
exclude_docs: |
  README.md
  AGENTS.md
  hooks.py
  __pycache__/**
  scripts/**
  provider_ports/**
  overrides/**
  _generated/**

theme:
  name: material
  custom_dir: docs/overrides

  language: en
  palette:
    # Palette toggle for automatic mode / light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            docstring_style: numpy
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            heading_level: 4
            inherited_members: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference: reference.md
  - Station Metadata: station-metadata.md
  - Station Map: map.md
  - Providers:
      - Bosnia and Herzegovina (AVP Sava): providers/ba_fhmzbih.md
      - Brazil (ANA): providers/br_ana.md
      - Canada (ECCC): providers/ca_eccc.md
      - Czechia (CHMI): providers/cz_chmi.md
      - France (Hub'Eau): providers/fr_hubeau.md
      - France (HydroPortail): providers/fr_hydroportail.md
      - Japan (MLIT): providers/jp_mlit.md
      - Lithuania (LHMT): providers/lt_lhmt.md
      - Norway (NVE): providers/no_nve.md
      - Poland (IMGW-PIB): providers/pl_imgw.md
      - Switzerland (FOEN): providers/ch_foen.md
      - Thailand (ThaiWater): providers/th_thaiwater.md
      - United States (USGS): providers/usgs_nwis.md
  - Worked Example: examples/camels-us.md
  - Contributing: contributing.md
  - Development:
      - Setup and Commands: development-conventions.md
      - Architecture: architecture.md
      - Choosing Useful Tests: maintenance/testing.md
      - Observation Stores: design/observation-store-layout.md
      - Catalogue Evidence: catalogue-evidence.md
      - Catalogue Absence: catalogue-absence.md
      - Catalogue Provenance: catalogue-provenance.md
      - Verification Evidence: maintenance/evidence.md

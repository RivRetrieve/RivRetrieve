name: Check Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "web/**"
      - "src/**"
      - "scripts/**"
      - "README.md"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/check-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install package and dependencies
        run: uv sync --all-extras --dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/station-explorer/package-lock.json

      - name: Install station explorer dependencies
        run: npm --prefix web/station-explorer ci

      - name: Export public station catalogue offline
        run: uv run python docs/scripts/generate_station_catalogue.py

      - name: Cache Natural Earth boundaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ne_50m_admin_0_countries.zip
          key: ne-50m-admin-0-countries-5fed433373581fa648920435f937d95f2d3c0200e067409c6478dcdf1b853139

      - name: Render coverage map
        run: |
          BOUNDARIES_ZIP="${{ runner.temp }}/ne_50m_admin_0_countries.zip"
          EXPECTED_SHA="5fed433373581fa648920435f937d95f2d3c0200e067409c6478dcdf1b853139"
          if [ ! -f "$BOUNDARIES_ZIP" ]; then
            curl -fsSL "https://naturalearth.s3.amazonaws.com/50m_cultural/ne_50m_admin_0_countries.zip" -o "$BOUNDARIES_ZIP"
          fi
          echo "$EXPECTED_SHA  $BOUNDARIES_ZIP" | sha256sum -c -
          uv run python docs/scripts/coverage_map.py --world "$BOUNDARIES_ZIP" --out docs/assets/coverage-map.png

      - name: Build station explorer
        env:
          VITE_CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: |
          if [ -z "$VITE_CARTO_BASEMAP_API_KEY" ]; then
            echo "::error::CARTO_BASEMAP_API_KEY is required to build the documentation basemap."
            exit 1
          fi
          npm --prefix web/station-explorer run build

      - name: Build documentation site
        run: uv run mkdocs build --strict

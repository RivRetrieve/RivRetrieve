name: Catalogue descriptors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogue-descriptors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Validate descriptors and public metadata
        run: uv run pytest tests/test_catalogue_descriptor.py tests/test_catalogue_description.py -q
      - name: Reproduce catalogues without network access
        run: uv run pytest tests/test_catalogue_origin_certification.py -k 'rebuilds' -q
      - name: Verify installed wheel metadata and excluded inputs
        run: uv run pytest tests/test_packaging_carries_catalogues.py tests/test_packaging_excludes_catalogue_build_inputs.py -q

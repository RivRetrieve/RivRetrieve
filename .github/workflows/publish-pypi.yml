name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "Target package index"
        required: true
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build package distributions
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rivretrieve
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rivretrieve
    permissions:
      id-token: write  # Mandatory for TestPyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  deploy-docs:
    name: Deploy documentation
    needs: [publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install package and dependencies
        run: uv sync --all-extras --dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/station-explorer/package-lock.json

      - name: Install station explorer dependencies
        run: npm --prefix web/station-explorer ci

      - name: Export public station catalogue offline
        run: uv run python docs/scripts/generate_station_catalogue.py

      - name: Build station explorer
        env:
          VITE_CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: |
          if [ -z "$VITE_CARTO_BASEMAP_API_KEY" ]; then
            echo "::error::CARTO_BASEMAP_API_KEY is required to build the documentation basemap."
            exit 1
          fi
          npm --prefix web/station-explorer run build

      - name: Build documentation site
        run: uv run mkdocs build --strict

      - name: Deploy to RivRetrieve.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: RivRetrieve/RivRetrieve.github.io
          publish_branch: main
          publish_dir: ./site

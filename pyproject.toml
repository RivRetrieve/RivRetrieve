[project]
name = "rivretrieve"
version = "0.1.49"
description = "A Python package for downloading global river gauge data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars",
    "pandas",
    "pydantic",
    "requests",
    "pyarrow>=24.0.0",
    "platformdirs>=4.10.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.13.1",
    "tzdata>=2026.2 ; sys_platform == 'emscripten' or sys_platform == 'win32'",
    "jsonschema>=4.25.1",
]

[project.scripts]
rivretrieve-rerecord = "rivretrieve._internal.recordings:main"

[project.optional-dependencies]
map = [
    "folium",
]


[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["/src/rivretrieve/_internal/providers/*/catalogue/native.parquet"]

[dependency-groups]
dev = [
    "pytest>=8.3", # tests
    "pytest-cov>=6.2.1",
    "ruff>=0.12", # linter + formatter
    "bump-my-version>=1.2.7",
    "ty>=0.0.35",
    "tqdm>=4.70.0",
]

# -----------------------
# Ruff (lint + format)
# -----------------------
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["reference/legacy_observations/", "research/"]

[tool.ruff.lint]
# Errors, warnings, naming, imports, modern py, bugbear, comprehensions, simplify
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
extend-select = ["TID251"]
ignore = [
    "E501", # let formatter handle wrapping
    "N803", # allow X, Y for ML-style params
    "N806", # allow X, Y for local vars
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"
"requests".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"
"urllib".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"

[tool.ruff.lint.per-file-ignores]
"src/rivretrieve/_internal/transport.py" = ["TID251"]
"src/rivretrieve/_internal/providers/*/generate_catalogue.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------
# ty (fast static type checker)
# -----------------------
[tool.ty.src]
exclude = ["reference/legacy_observations/", "research/"]
# [tool.ty.rules]
# possibly-unresolved-reference = "warn"

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

# -----------------------
# Bump My Version
# -----------------------
[tool.bumpversion]
current_version = "0.1.49"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/rivretrieve/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.uv.sources]
# ctrl-freak = { git = "https://github.com/hydrosolutions/ctrl-freak.git", rev = "main" } # example of how to add a git dependency

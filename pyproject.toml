[project]
name = "rivretrieve"
version = "0.1.1"
description = "A Python package for downloading global river gauge data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars",
    "pandas",
    "pydantic",
    "requests",
    "pyarrow>=24.0.0",
    "platformdirs>=4.10.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
    "tzdata>=2026.2 ; sys_platform == 'emscripten' or sys_platform == 'win32'",
    "jsonschema>=4.25.1",
    "python-dotenv>=1.2.2",
    "urllib3>=2.8.0,<3",
]

[project.scripts]
rivretrieve-rerecord = "rivretrieve._internal.recordings:main"

[project.optional-dependencies]
map = [
    "folium",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Source exclusions also apply when building wheels from the sdist.
source-exclude = [
    "/web/**",
    "/.distribution-checks/**",
    "/src/rivretrieve/_internal/providers/*/catalogue/native.parquet",
    "/tests/test_data/**",
    "/tests/recordings/**",
    "/research/**",
    "/maintenance/**",
    "/planning/**",
    "/scratchpad/**",
    "/.pce/**",
    "/.worktrees/**",
    "/credentials/**",
    "/.env.*",
    "/*.env",
    "/*.pem",
    "/*.key",
    "/src/**/.worktrees/**",
    "/src/**/.distribution-checks/**",
    "/src/**/credentials/**",
    "/src/**/.env",
    "/src/**/.env.*",
    "/src/**/*.env",
    "/src/**/*.pem",
    "/src/**/*.key",
    "/.env",
]
wheel-exclude = [
    "/src/rivretrieve/_internal/providers/*/catalogue/native.parquet",
    "/src/**/.worktrees/**",
    "/src/**/.distribution-checks/**",
    "/src/**/credentials/**",
    "/src/**/.env",
    "/src/**/.env.*",
    "/src/**/*.env",
    "/src/**/*.pem",
    "/src/**/*.key",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.2.1",
    "ruff>=0.12",
    "ty>=0.0.35",
    "tqdm>=4.70.0",
    "mlcroissant>=1.1.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "uv-build>=0.12.1,<0.13",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
extend-select = ["TID251"]
ignore = [
    "E501", # Allow long lines that the formatter cannot wrap.
    "N803", # allow X, Y for ML-style params
    "N806", # allow X, Y for local vars
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"
"requests".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"
"urllib".msg = "Provider network access must use rivretrieve._internal.transport.HttpClient"

[tool.ruff.lint.per-file-ignores]
"src/rivretrieve/_internal/transport.py" = ["TID251"]
"src/rivretrieve/_internal/providers/*/generate_catalogue.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.format]
exclude = ["docs/**"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
